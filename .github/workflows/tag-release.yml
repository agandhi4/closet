name: Tag Release on Merge

on:
    pull_request:
        types: [closed]
        branches: [main]

jobs:
    tag:
        if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Extract version from branch name
              id: version
              run: |
                  BRANCH="${{ github.event.pull_request.head.ref }}"
                  VERSION="${BRANCH#release/}"
                  echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

            - name: Create and push tag
              run: |
                  git tag ${{ steps.version.outputs.tag }}
                  git push origin ${{ steps.version.outputs.tag }}

            # A tag pushed with GITHUB_TOKEN starts no workflow, so CI (tests,
            # then publish) is dispatched on the tag explicitly.
            - name: Run CI and publish the tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh workflow run ci.yml --ref ${{ steps.version.outputs.tag }}
