name: Github Actions CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22.x" # set this to the node version to use

jobs:
  back-end-ci:
    name: back-end-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@master

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm install & build
        run: |
          npm install
          npm run build

      - name: npm format:check
        run: |
          npm run format:check

      - name: npm lint
        run: |
          npm run lint

      - name: npm test:cov
        run: |
          npm run test:cov

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: npm test:e2e:smoke local
        run: |
          npm run test:e2e:smoke
        env:
          CI: true
          APP_NAME: Closet
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: sqlite
          FILE_STORAGE_TYPE: local

      - name: npm test:load local
        run: |
          npm run test:load
        env:
          CI: true
          APP_NAME: Closet
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: sqlite
          FILE_STORAGE_TYPE: local

      - name: start postgresql db
        uses: harmon758/postgresql-action@v1
        with:
          postgresql version: "11" # See https://hub.docker.com/_/postgres for available versions
          postgresql db: "postgres-test"
          postgresql user: "test"
          postgresql password: "Password123"

      # minio/minio vanished from Docker Hub (and quay.io needs auth), so the
      # object-storage jobs run against adobe/s3mock: path-style S3, accepts any
      # credentials, no CLI needed. v5 ignores the initialBuckets env, hence the PUT.
      - name: start s3mock object storage
        run: |
          docker run -d -p 9000:9090 --name s3mock adobe/s3mock:5
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:9000/ && break
            sleep 1
          done
          curl -sf -X PUT http://127.0.0.1:9000/test-closet

      - name: npm test:e2e:smoke remote
        run: |
          npm run test:e2e:smoke
        env:
          CI: true
          APP_NAME: Closet
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: "test"
          DATABASE_PASS: "Password123"
          DATABASE_SCHEMA: "postgres-test"
          DATABASE_SSL: "false"
          FILE_STORAGE_TYPE: object
          OBJECT_STORAGE_BUCKET_NAME: test-closet
          OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
          OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000

      - name: npm test:load remote
        run: |
          npm run test:load
        env:
          CI: true
          APP_NAME: Closet
          ACCESS_TOKEN_SECRET: SecretKey
          PUSH_NOTIFICATION_ENDPOINT: test
          EMAIL_FROM_ADDRESS: test
          EMAIL_PASSWORD: test
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: "test"
          DATABASE_PASS: "Password123"
          DATABASE_SCHEMA: "postgres-test"
          DATABASE_SSL: "false"
          FILE_STORAGE_TYPE: object
          OBJECT_STORAGE_BUCKET_NAME: test-closet
          OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
          OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000

      - name: upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: scripts/results/

      # Performance, best practices, and health check
      - name: run lighthouse
        run: npm run lighthouse

      - name: check for dependency updates
        run: npx npm-check-updates
