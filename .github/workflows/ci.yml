name: CI

# PRs are gated on the Mac / linux-box, not here (owner, 2026-09-28: GitHub Actions limits):
# `make gate PR=<n>` (devkit/bin/local_gate.sh + scripts/ci/gate_plan.sh) runs the Makefile's
# ci-* targets on the PR merged into main and posts one `local-gate` status, which branch
# protection requires with `codex-review`. Images ship from linux-box (`make publish`, homelab's
# devkit-publish@closet.timer; docs/decisions.md 2026-10-28), not from here.
# What is left is a manual cloud run of the gate's test jobs: they call the same make targets as
# the gate, so the two cannot drift.
on:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit with the exact version beside it; Renovate (renovate.json, devkit's
# preset) proposes updates.
jobs:
  # The gate's jobs, one per runner so the tests do not share it with type-aware
  # ESLint and tsc (#113). Postgres comes from devkit/bin/throwaway_pg.sh inside the
  # make target, as on the gate box, not from a services container.
  static:
    name: format, lint, types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make ci-deps ci-quick

  test:
    name: unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Every core: vitest.config.mts gives the tests all of them under CI.
      # ci-db is test:cov (every Vitest project, v8 coverage). Coverage is gated by the PR
      # gate's metrics ratchet (make ci-metrics), not here.
      - run: make ci-deps ci-db

  e2e:
    name: browser (production config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The env (PWA on, VAPID keys) is the Makefile's, shared with the gate; `screenshots`
      # then takes the 390 px shots on a server of its own.
      - run: make ci-deps ci-e2e screenshots PLAYWRIGHT_FLAGS=--with-deps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - id: screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots-390px
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link the screenshots
        if: always() && steps.screenshots.outputs.artifact-url != ''
        env:
          URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          {
            echo "### Phone screenshots (390 px, seed personas)"
            echo ""
            echo "[screenshots-390px]($URL): demo, sparse and fresh on the key pages."
          } >> "$GITHUB_STEP_SUMMARY"
