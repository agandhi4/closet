# shellcheck shell=bash
# Steps for .githooks/pre-commit and pre-push (format: devkit/bin/hook_steps.sh). Each step is a
# Makefile ci-* target, the same one the gate runs, so a hook cannot drift from it.
# Hooks stay hermetic: never ci-db (Postgres), ci-e2e (build + Playwright) or ci-image; the gate
# runs those on the PR. Before 2026-10-13 pre-commit ran the integration tier against
# pgvault-dev and pre-push ran Playwright on a push to main; both needed local services.
# No ENV_REQUIRED_HOOKS: no step reads .env, so fresh worktrees commit and push cleanly.
# Budgets (scorecard T8): pre-commit <= 30 s, pre-push <= 60 s at p90, on a box shared with agents.
# Together the two hooks run all of ci-quick (the Makefile's union of its parts), plus ci-unit.
# pre-commit: the sub-second guards, the staged paths' secrets scan, cached prettier + eslint.
# pre-push: tsc (incremental, but cold in a fresh worktree), then the unit projects.
# shellcheck disable=SC2034  # read by hook_steps.sh
PRE_COMMIT_STEPS=("guards=ci-guards-staged" "secrets=secrets-staged" "lint=ci-lint")
# shellcheck disable=SC2034
PRE_PUSH_STEPS=("typecheck=ci-typecheck" "unit=ci-unit")
