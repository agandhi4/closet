# Metrics collectors, one per line: <name> <area> <command...> (devkit/bin/metrics_collect.sh
# header). Bounds: docs/metrics/ratchet.json; `make ci-metrics` is the gate's last job. In the gate
# ts-backend runs when an `other` path changed (all of src/ is other), dup always, cov when the
# db job ran. The scope is `backend`, as for every single-package Node service (devkit's
# node-service scaffold).
#
# No bundle: `npm run build` is tsc plus esbuild/tailwind/workbox steps, not vite, which is all
# ts.mjs --bundle measures. knip reads knip.jsonc (closet's entry points and importmap names) over devkit/lint/knip.base.jsonc;
# jscpd has no .jscpd.json: devkit/lint/jscpd.base.json leaves the specs and *.d.ts out.
# Seconds on the Mac, unloaded (2026-10-16): ts-backend 56 (two type-aware eslint passes, 23 and
# 22; knip 2; dependency-cruiser 9), dup and cov under 1 each.
ts-backend other node devkit/metrics/ts.mjs --root . --src src --scope backend --cyclomatic --cognitive --knip --knip-base --cycles --out build/metrics/ts-backend.json
dup repo node devkit/metrics/jscpd.mjs --scope repo --base --out build/metrics/dup.json src
# Coverage of the whole Vitest suite (unit + integration, `npm run test:cov`), from the report
# the db job (`job db ci-db` in gate_plan.sh's gate_plan_extra) writes. job:db runs it exactly
# when that job ran, which a PR touching only .github/**, Playwright specs or tooling skips.
# Outside the gate, run `make ci-db` first.
cov job:db python3 -I devkit/metrics/coverage.py --scope backend --istanbul-summary coverage/coverage-summary.json --out build/metrics/cov.json
# Upward imports in src/ (scripts/ci/layers.conf `known` lines; direction lower), from the check
# `make layer-check` runs in ci-quick. `repo`, so a PR that edits only layers.conf is measured.
layers repo python3 -I devkit/bin/layer_check.py --metrics-out build/metrics/layers.json
# Statement budgets (decision H, tolerance 0): the most SQL statements each recordQueries route sent,
# from the file `make ci-db` writes (STATEMENTS_OUT); --min-routes is today's route count, so a fixture that stopped recording fails.
statements job:db python3 -I devkit/metrics/statements.py --in build/statements.json --out build/metrics/statements.json --min-routes 87
