# Metrics collectors, one per line: <name> <area> <command...> (devkit/bin/metrics_collect.sh
# header). Bounds: docs/metrics/ratchet.json; `make ci-metrics` is the gate's last job. In the gate
# ts-backend runs when an `other` path changed (all of src/ is other), dup always, cov when the
# db job ran. The scope is `backend`, as for every single-package Node service (devkit's
# node-service scaffold).
#
# No bundle: `npm run build` is tsc plus esbuild/tailwind/workbox steps, not vite, which is all
# ts.mjs --bundle measures. knip reads knip.jsonc (closet's entry points and importmap names).
# Seconds on the Mac, unloaded (2026-10-16): ts-backend 56 (two type-aware eslint passes, 23 and
# 22; knip 2; dependency-cruiser 9), dup and cov under 1 each.
ts-backend other node devkit/metrics/ts.mjs --root . --src src --scope backend --cyclomatic --cognitive --knip --cycles --out build/metrics/ts-backend.json
dup repo node devkit/metrics/jscpd.mjs --scope repo --out build/metrics/dup.json src
# Coverage of the whole Vitest suite (unit + integration, `npm run test:cov`), from the report
# the db job (`job db ci-db` in gate_plan.sh's gate_plan_extra) writes. job:db runs it exactly
# when that job ran, which a PR touching only .github/**, Playwright specs or tooling skips.
# Outside the gate, run `make ci-db` first.
cov job:db python3 -I devkit/metrics/coverage.py --scope backend --istanbul-summary coverage/coverage-summary.json --out build/metrics/cov.json
