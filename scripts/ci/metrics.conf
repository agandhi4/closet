# Metrics collectors, one per line: <name> <area> <command...> (devkit/bin/metrics_collect.sh
# header). Bounds: docs/metrics/ratchet.json; `make ci-metrics` is the gate's last job. src/ is the
# fleet's `other`, so in the gate these run for any change outside docs; the scope is `backend`,
# as for every single-package Node service (devkit's node-service scaffold).
#
# No bundle: `npm run build` is tsc plus esbuild/tailwind/workbox steps, not vite, which is all
# ts.mjs --bundle measures. knip reads knip.jsonc (closet's entry points and importmap names).
# Seconds on the Mac, unloaded (2026-10-16): ts-backend 56 (two type-aware eslint passes, 23 and
# 22; knip 2; dependency-cruiser 9), dup under 1.
ts-backend other node devkit/metrics/ts.mjs --root . --src src --scope backend --cyclomatic --cognitive --knip --cycles --out build/metrics/ts-backend.json
dup repo node devkit/metrics/jscpd.mjs --scope repo --out build/metrics/dup.json src
