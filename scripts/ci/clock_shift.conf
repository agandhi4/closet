# What the gate's clock shift (devkit README "Clock shift") cannot move: vitest test ids, each with
# its reason after the first '#'. Each one compares an age the app computes from its shifted clock
# against a write Postgres stamped (`now()` in the Muse round queries), which stays on the real clock.
test/integration/muse-round-close.spec.ts > a round its agent left open > leaves a round alone while its newest write is younger than the quiet period  # the round's writes are stamped by Postgres now(): the newest looks long quiet
test/integration/muse-round-close.spec.ts > a round its agent left open > closes it once quiet: the newest write’s token, no summary, the cursor untouched, one notification  # the round's writes are stamped by Postgres now(): an earlier test's round closes first
