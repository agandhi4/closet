# Code-structure rules judged by devkit/bin/guard_check.py (`make guard-check`, in ci-quick;
# grammar: the script header, devkit/README.md "Guards"). Lint rules stay in eslint.config.mjs
# (hono/html, the pure layers' imports, no-console, the vi.mock ban): eslint runs in the editor.
# A rule here replaced no closet test unless its comment names one; debt goes in `known`.

[backend]
lang     ts
root     .
src      src
exclude  *.spec.ts *.spec.tsx

# AGENTS.md Request security: a user-supplied URL or a third-party API is fetched only through
# createOutboundFetcher, which pins the checked address (SSRF guard). Its DNS and the global fetch
# therefore belong to that one file. New: outbound-fetch.spec.ts proves the door's behaviour, not
# that it is the only one.
@outbound-sockets only-import node:dns,dns,undici src/web/security/outbound-fetch.ts
# #496a: outbound-dial.ts's dial() is the one way a connection opens, to the checked address with
# the certificate verified against the name. TLS (and https, which would dial for itself) belongs
# to it, as does net's connect; the namespace spellings (`net.connect(`) are banned outright.
# Both specifiers (`node:x` and bare `x`) are covered by every rule here; http.request/http.get are
# banned outside outbound-fetch.ts (the server's own http use is only errors.tsx's STATUS_CODES and a
# type import; test fixtures live under test/, outside this section's src).
@outbound-tls only-import node:tls,tls,node:https,https src/web/security/outbound-dial.ts
# #496b: an h2 session is built only inside dial(), on the socket it connected (`createConnection`),
# so http2 is that file's too (outbound-fetch.ts imports its types alone, which are erased).
@outbound-http2 only-import node:http2,http2 src/web/security/outbound-dial.ts
# #568: net's Socket class (and its alias Stream) opens a connection with `new Socket().connect(`,
# so it is banned beside connect: imported, constructed under any binding, or reconnected as
# `socket.connect(`. cutout/listener.ts's `new Socket()` is pg's own connection to the database
# (pg calls its connect), not an outbound one.
@outbound-tcp ban-import src node:net:connect,createConnection,Socket,Stream except src/web/security/outbound-dial.ts:connect src/cutout/listener.ts:Socket
@outbound-tcp-bare ban-import src net:connect,createConnection,Socket,Stream
@outbound-socket-class ban-call Socket,Stream src except src/cutout/listener.ts
@outbound-dial-calls ban-call net.connect,net.createConnection,net.Socket,net.Stream,socket.connect,tls.connect,https.request,https.get,http2.connect,http.request,http.get src
# errors.tsx reads STATUS_CODES, so it may import node:http, but never the names that open a
# socket. The names ban is a deny-list: `import * as http` in errors.tsx would pass it, and no
# kit rule allows a file a list of names only. same-origin.ts's type import is erased, so unseen.
@outbound-http only-import node:http,http src/web/security/outbound-fetch.ts src/web/errors.tsx
@outbound-http-sockets ban-import src node:http:request,get,Agent,globalAgent,ClientRequest except src/web/security/outbound-fetch.ts:request
@outbound-http-sockets-bare ban-import src http:request,get,Agent,globalAgent,ClientRequest
@outbound-fetch ban-call fetch src

# AGENTS.md Architecture: seededRandom (src/random.ts) is the one PRNG, so a run is decided by
# its key. New: no test held it.
@seeded-random ban-call Math.random src

# AGENTS.md Web layer: config arrives resolved as WebConfig; nothing in src/web/ loads it.
# New: no test held it. Type-only imports are erased, so this judges loadConfig, not the type.
@web-config ban-import src/web src/config:loadConfig

# AGENTS.md Logging: an error is logged by its fields, never its text (an upstream message can
# carry a token or a customer's address). Dotted suffix: logger.* holds this.logger and
# deps.logger, log.* holds Fastify's request.log. Seed: rollcall #63.
@no-raw-error-text call-arg-ban logger.*,webLogger.*,mcpLogger.*,log.* String(err),err.message,${err},err.stack src/**

# One owner per transaction: one is opened, committed or rolled back only in the query and
# write modules below, and the migration baseline. Raw BEGIN/COMMIT strings count too. New: no
# test held it; devkit #113 (scorecard arch.own_commit).
@own-tx own-transaction src/**/queries.ts src/web/wardrobe/writes.ts src/web/wardrobe/status.ts src/web/files/pending-photos.ts src/web/files/photos.ts src/web/auth/personal-tokens.ts src/web/week-plan/template.ts src/cutout/queue.ts src/maintenance/revoke-push.ts src/seed/seed.ts src/db/migrate.ts:recordBaseline
# A refused field's red and aria-invalid (src/ outside specs) are spelled only by src/web/form-field.tsx,
# which also describes and announces its messages; the account forms' inline-check slots are their own design.
@field-invalid only-text /input-error|aria-invalid/ src/web/form-field.tsx src/web/auth/form.tsx
# A form control is never `display:none` (#674): a hidden radio or checkbox is no tab stop and has no
# role or state for VoiceOver (the filter sheet's chips were). Choices are `input.btn` chips (Chips,
# form-field.tsx). Only the password manager's readonly username twin and the share page's file
# input the module fills are hidden by design. `hidden` counts as any class token, not just the first.
@hidden-control only-text /<(input|select|textarea)\b[^>]*\bclass=\W{1,3}(?:[^\s>]+\s+)*hidden(?![\w-])/ src/web/auth/tokens-page.tsx src/web/auth/pages.tsx src/web/inspiration/share-confirm-page.tsx
# A checklist's protocol (checked ids + every id `shown`; shown and unchecked leaves) is src/web/checklist.tsx:
# the body schema, `unchecked` and the hidden input. Trips had reached into capsules' validation for it.
@checklist-shown only-text /name\W{1,4}shown\b/ src/web/checklist.tsx
# A place search's posted coordinates and their schema are src/web/weather/place-picker.tsx's: the
# profile's home and a trip's destination each spelled the fields, the bounds and the body.
@place-fields only-text "/name\W{1,4}(latitude|longitude|timeZone)\b|minimum: -90/" src/web/weather/place-picker.tsx
# A timer's loop (schedule after the last run, one cron job per run, a bounded stop) is
# src/maintenance/scheduled.ts's scheduleJob; nightly and minutely each had a copy.
@cron-loop only-text /runAsJob\('cron'/ src/maintenance/scheduled.ts
# Link tabs (role, lit class, aria-selected) are src/web/layout/link-tabs.tsx's; a sheet's
# tap-outside close is SheetBackdrop's (parts.tsx). Three and nine hand-written copies before.
@link-tabs only-text tab-active src/web/layout/link-tabs.tsx
@sheet-backdrop only-text modal-backdrop src/web/layout/parts.tsx
# An add or edit page's frame (app bar, one guarded native post, Cancel beside the submit, a
# guarded Delete) is src/web/layout/form-page.tsx's (#411): only the trip form had opted in to
# the offline guard. Cancel is spelled only there, so a new add/edit page starts from FormPage.
@form-page only-text /<CancelLink\b/ src/web/layout/form-page.tsx
# Every PostForm is disabled offline (owner, 2026-10-22; #411): a cached form posting without a
# connection lands on the worker's offline page and loses what was typed. The one opt-out,
# `allowOffline`, is spelled outside form.tsx (which declares and reads it) only as
# allowOffline="<a literal of 12+ characters>", so review reads why; a bare, empty, computed or
# spread reason fails (\x22 is the quote: the conf takes none inside a word). expectFullPage
# checks the default.
@post-form-offline only-text /\ballowOffline\b(?!=\x22[^\x22]{12,}\x22)/ src/web/auth/form.tsx

# #188 (docs/plans/2026-11-12-json-api.md section 4): access is decided in the domain function,
# which throws NotFound(resource) or Forbidden() (src/web/refusals.ts, messages from one table),
# so pages, MCP and the API refuse alike. Its own section so its debt is its own ratchet key
# (guards.refusals.known); each #188 area PR deletes its `known` lines.
[refusals]
lang     ts
root     .
src      src
exclude  *.spec.ts *.spec.tsx

# A hand-written 404 or 403 anywhere: the typed refusals are its one spelling. app.ts's is the
# not-found handler (an unknown path, not a resource). Per line: a status prettier wraps onto
# the next line is unseen (no such 403/404 today).
@raw-refusal only-text /new\sHttpError\(40[34]\b/ src/app.ts
# A route or tool parses, calls and renders: it never decides a refusal itself, typed or not.
@route-refusal ban-call NotFound,Forbidden src/web/*routes.ts src/web/*routes.tsx src/web/mcp/tools
# NotServed (refusals.ts) is a request concern a route owns, never an access decision: a 404
# with the status text alone, as if the path did not exist. Only these sites, each for its
# reason: files/routes.ts, the public image server's name that is no stored photo, or a private
# photo's (a selfie, a saved look); files/photos.ts, a share id with no garment photo and bytes
# missing from storage; metrics/routes.ts, /metrics asked through a reverse proxy. A new site
# gets its file here and its reason in this comment, in the same change.
@not-served only-text /new\sNotServed\(/ src/web/files/routes.ts src/web/files/photos.ts src/web/metrics/routes.ts

# No `known` lines: #188 removed every raw refusal, so a new one fails at once.
