# closet's dependency direction, checked by devkit/bin/layer_check.py (`make layer-check`, part
# of ci-quick; conf format in its header). Bottom first: a file imports only from its own layer
# or a lower one. The layering: docs/architecture.md (Architecture, the pure layers) and
# docs/web-layer.md#code-no-feature-owns. Type-only imports are erased, so a `type` import may
# point anywhere (src/types/fastify.d.ts, web/plugin.ts's JobRoster). The pure layers' ban on
# drizzle-orm and node:* stays in eslint.config.mjs (no-restricted-imports): a package is not
# ours, so this guard does not see it.
[backend]
lang     ts
root     .
src      src
exclude  *.spec.ts *.spec.tsx

# Shared plain helpers every layer may use (calendar days, the seeded PRNG, paths, the request's
# AsyncLocalStorage, the static paths, the fragment test the service worker shares, the credential names the redactor reads, the warm marker).
layer    shared src/calendar-date.ts src/random.ts src/project-root.ts src/request-context.ts src/static-prefixes.ts src/static-assets.ts src/build-info.ts src/storage-probe.ts src/credential-names.ts src/warm-request.ts src/htmx src/types
# The env schema and the pino logger.
layer    infra src/config.ts src/logger.ts
# The pure layers: rules over plain values, no database, web or I/O. Peers of infra: they read
# no config and log nothing.
peer     pure src/wardrobe src/weather src/push
layer    metrics src/metrics
# Drizzle's schema (which takes its enums from the pure layers) and the client.
layer    db src/db
# Background removal: the queue, its queries and the model's child process.
layer    cutout src/cutout
# Every route and page; the features import each other freely (docs/web-layer.md).
layer    web src/web
# The nightly and minutely timers, reconciliation and the CLIs' work (reuse the web services).
layer    maintenance src/maintenance
# The seed personas (drive the web services and the maintenance jobs).
layer    seed src/seed
# Composition roots: createApp, serve, the production entry and every CLI.
entry    src/app.ts src/server.ts src/main.ts src/**/*.cli.ts

# The cutout status vocabulary is a constant module that imports nothing; the schema's enum
# column takes it the way it takes the pure layers' enums.
allow    src/db/schema.ts -> src/cutout/state.ts
